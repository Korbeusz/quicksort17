name: ChatGPT optimized APK build

on:
  push:
    branches:
      - chatgpt-apk-build-20260823
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore and patch Android project
        run: |
          mkdir -p PaceMetronome
          cat chatgpt-build/chunks/00.b64 chatgpt-build/chunks/01.b64 chatgpt-build/chunks/02.b64 chatgpt-build/chunks/03.b64 chatgpt-build/chunks/04.b64 chatgpt-build/chunks/05p00.b64 chatgpt-build/chunks/05p01.b64 chatgpt-build/chunks/05p02.b64 chatgpt-build/chunks/05p03.b64 chatgpt-build/chunks/05p04.b64 chatgpt-build/chunks/05p05.b64 chatgpt-build/chunks/05p06.b64 chatgpt-build/chunks/05p07.b64 chatgpt-build/chunks/06.b64 chatgpt-build/chunks/07.b64 chatgpt-build/chunks/08.b64 | base64 -d | tar -xz -C PaceMetronome
          patch -p2 -d PaceMetronome < chatgpt-build/patches/01-build.patch
          patch -p2 -d PaceMetronome < chatgpt-build/patches/02-main.patch
          patch -p2 -d PaceMetronome < chatgpt-build/patches/03-expander.patch
          cp chatgpt-build/overlay/StateStore.java PaceMetronome/app/src/main/java/com/example/pacemetronome/StateStore.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install available Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sed -i 's/compileSdk = 37/compileSdk = 36/' PaceMetronome/app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build shrunk release APK
        working-directory: PaceMetronome
        run: gradle --no-daemon assembleRelease

      - name: Verify APK
        run: |
          APK=PaceMetronome/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaceMetronome-optimized-release-apk
          path: PaceMetronome/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
