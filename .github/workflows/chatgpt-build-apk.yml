name: ChatGPT optimized APK build

on:
  push:
    branches:
      - chatgpt-apk-build-20260823

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore optimized Android project
        run: |
          mkdir -p PaceMetronome
          tar -xzf chatgpt-build/PaceMetronome-optimized-source.tar.gz -C PaceMetronome

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install available Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sed -i 's/compileSdk = 37/compileSdk = 36/' PaceMetronome/app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run model tests
        working-directory: PaceMetronome
        run: ./tools/run-model-tests.sh

      - name: Build shrunk release APK
        working-directory: PaceMetronome
        run: gradle --no-daemon assembleRelease

      - name: Verify APK
        run: |
          APK=PaceMetronome/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaceMetronome-optimized-release-apk
          path: PaceMetronome/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
